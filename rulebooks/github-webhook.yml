---
# EDA Rulebook: GitHub CD Webhook Listener
#
# This rulebook listens for webhook events from GitHub Actions and
# triggers the "Deploy Web App" job template on Automation Controller.
#
# Activated via: EDA Controller UI -> Rulebook Activations
# Source plugin: ansible.eda.webhook (from the ansible.eda collection)

- name: Listen for GitHub CD events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Deploy on app change
      condition: event.payload.message == "App updated"
      action:
        run_job_template:
          name: "Deploy Web App"
          organization: "Default"
          job_args:
            extra_vars:
              commit_sha: "{{ event.payload.commit_sha }}"
              repo_url: "https://github.com/{{ event.payload.repo }}"
              committer: "{{ event.payload.committer }}"
