---
# Reference inventory for local testing.
# The actual inventory is configured inside Automation Controller.
#
# Replace the IP/hostname below with your RHEL VM details.

all:
  children:
    webservers:
      hosts:
        rhel-demo-vm:
          ansible_host: 192.168.1.100        # <-- Replace with your RHEL VM IP
          ansible_user: ansible               # <-- Replace with your SSH user
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
