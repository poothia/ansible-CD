---
# Variables for the webservers group

# Application paths
app_dir: /opt/aap-demo/app
venv_dir: /opt/aap-demo/venv

# Application user
app_user: aap-demo
app_group: aap-demo

# Gunicorn binding (httpd reverse-proxies to this)
gunicorn_bind: "127.0.0.1:8080"

# Webapp repository URL (override via extra_vars from EDA)
repo_url: "https://github.com/OWNER/WEBAPP_REPO"
