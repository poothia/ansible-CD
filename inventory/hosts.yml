---
# Reference inventory for local testing.
# The actual inventory is configured inside Automation Controller.
#
# Replace the values below with your RHEL 9 VM details.

all:
  children:
    webservers:
      hosts:
        rhel9-demo:
          ansible_host: 192.168.1.100        # <-- your RHEL 9 VM IP
          ansible_user: ansible               # <-- your SSH user
