---
# Playbook: Deploy Web App
#
# Used in both demos:
#   Demo 1 — chained after setup-webserver.yml via a Workflow Template
#   Demo 2 — triggered automatically by EDA Controller
#
# Receives extra_vars: repo_url, commit_sha, committer
#
# What it does:
#   1. Clones the webapp repo at the specified commit
#   2. Installs Python dependencies into a virtualenv
#   3. Deploys the Gunicorn systemd service
#   4. Verifies the app is healthy via /health endpoint

- name: Deploy Flask web application
  hosts: all
  become: true

  vars:
    repo_url: "https://github.com/poothia/demo-webapp.git"
    commit_sha: "main"
    committer: "automation"
    checkout_dir: /tmp/webapp_deploy
    app_dir: /opt/aap-demo/app
    venv_dir: /opt/aap-demo/venv
    app_user: aap-demo
    app_group: aap-demo
    gunicorn_bind: "127.0.0.1:8080"

  tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Deploying web application...
            Repo:      {{ repo_url }}
            Commit:    {{ commit_sha }}
            Triggered: {{ committer }}

    # -- Clone the webapp repo --------------------------------------------

    - name: Remove previous checkout
      ansible.builtin.file:
        path: "{{ checkout_dir }}"
        state: absent

    - name: Clone webapp repository at specific commit
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ checkout_dir }}"
        version: "{{ commit_sha }}"
        depth: 1
        force: true

    # -- Install application ----------------------------------------------

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Sync application files to app directory
      ansible.builtin.copy:
        src: "{{ checkout_dir }}/"
        dest: "{{ app_dir }}/"
        remote_src: true
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv {{ venv_dir }}
        creates: "{{ venv_dir }}/bin/activate"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        state: present

    # -- Build metadata ---------------------------------------------------

    - name: Write commit SHA
      ansible.builtin.copy:
        content: "{{ commit_sha }}"
        dest: "{{ app_dir }}/COMMIT_SHA"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"

    - name: Write build timestamp
      ansible.builtin.copy:
        content: "{{ ansible_date_time.iso8601 }}"
        dest: "{{ app_dir }}/BUILD_TIME"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"

    # -- Gunicorn systemd service -----------------------------------------

    - name: Deploy Gunicorn systemd service
      ansible.builtin.template:
        src: aap-demo.service.j2
        dest: /etc/systemd/system/aap-demo.service
        mode: "0644"
      notify:
        - reload systemd
        - restart aap-demo

    - name: Set environment file for the service
      ansible.builtin.copy:
        content: |
          COMMIT_SHA={{ commit_sha }}
          BUILD_TIME={{ ansible_date_time.iso8601 }}
        dest: /opt/aap-demo/env
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      notify: restart aap-demo

    # -- Flush and verify -------------------------------------------------

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Wait for app to be healthy
      ansible.builtin.uri:
        url: "http://{{ gunicorn_bind }}/health"
        return_content: true
        status_code: 200
      register: health
      retries: 5
      delay: 3
      until: health.status == 200

    - name: Print deployment result
      ansible.builtin.debug:
        msg: |
          Deployment successful!
            App version: {{ health.json.version }}
            Live at:     http://{{ ansible_host }}/
            Commit:      {{ commit_sha }}

    # -- Cleanup ----------------------------------------------------------

    - name: Clean up checkout
      ansible.builtin.file:
        path: "{{ checkout_dir }}"
        state: absent

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart aap-demo
      ansible.builtin.systemd:
        name: aap-demo
        state: restarted
        enabled: true
